name: Roll season dates

# Adds the next league year to the charter as soon as the NFL publishes the
# dates it depends on. Opens a pull request rather than pushing to main: these
# dates are roster and money deadlines for ten managers, so a bad scrape
# should be something to click past, not something already published.
#
# Also runnable by hand from the Actions tab.

on:
  schedule:
    # Mondays, 13:00 UTC. Most runs do nothing. The ones that matter land in
    # February, when the draft date is knowable, and in May, when the NFL
    # releases the preseason and regular season schedule.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  roll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the PDF builder's dependency
        run: pip install --quiet reportlab

      - name: Work out whether a season can be rolled
        id: roll
        run: python tools/roll_season.py

      - name: Rebuild every format
        if: steps.roll.outputs.status == 'updated'
        run: |
          BASE="$(grep -o 'property="og:image" content="[^"]*card.png"' index.html \
                  | sed 's/.*content="//; s/card\.png"//')"
          python tools/build_charter_html.py charter_spec.json index.html "$BASE"
          python tools/build_charter_md.py charter_spec.json charter.md
          python tools/build_charter_ps2.py charter_spec.json pdf/charter-ps2.pdf

      - name: Open a pull request
        if: steps.roll.outputs.status == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ steps.roll.outputs.year }}
        run: |
          if git diff --quiet; then
            echo "Nothing changed after the rebuild."
            exit 0
          fi
          BRANCH="season/$YEAR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -q -m "Add the $YEAR league dates"
          git push -q -f origin "$BRANCH"
          if ! gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr create --base main --head "$BRANCH" \
              --title "Add the $YEAR league dates" \
              --body "Generated by the roll-season workflow from the $YEAR NFL anchor dates in \`charter_spec.json\`.

          Check the three anchors under \`seasons.$YEAR\` against the NFL schedule before merging. Every other date is derived from them by the rules in the charter, so if the anchors are right the rest follows.

          Merging publishes the new calendar to the live page."
          fi

      - name: Ask for the draft date
        if: steps.roll.outputs.needs_draft_date == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ steps.roll.outputs.year }}
        run: |
          TITLE="Add the $YEAR NFL draft date"
          if gh issue list --state open --search "$TITLE in:title" \
               --json title --jq '.[].title' | grep -qxF "$TITLE"; then
            echo "Already asked."
            exit 0
          fi
          gh issue create --title "$TITLE" --body "The $YEAR offseason calendar
          cannot be generated until the last day of the NFL draft is recorded.

          Add it to \`charter_spec.json\`:

          \`\`\`json
          \"seasons\": { \"$YEAR\": { \"nfl_draft_end\": \"$YEAR-04-27\" } }
          \`\`\`

          Then run:

          \`\`\`bash
          python3 tools/build_dates.py charter_spec.json $YEAR
          bash update.sh \"Add the $YEAR league dates\"
          \`\`\`

          Or just add the date and let this workflow finish the rest on its next run.
          The preseason and regular season anchors are fetched automatically once the
          NFL releases the schedule, around May."
